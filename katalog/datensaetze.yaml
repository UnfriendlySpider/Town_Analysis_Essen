      Damit lässt sich etwa zeigen, wie viele Solaranlagen und Speicher es in Essen gibt und wie schnell sie
      hinzukommen. Geplant ist eine Auswertung je Stadtteil; derzeit nutzt die App den Datensatz in keinem Thema.

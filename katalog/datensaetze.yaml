      seit 2007 verändert hat. Diese App nutzt sie im Thema „Haushalte“, auch mit einer Karte über die Jahre. Das
      Thema beschreibt, wer in einem Stadtteil wohnt, und zählt nicht zur Mehrfachbelastung.

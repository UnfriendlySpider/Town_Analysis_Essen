  analysen: [versiegelung]
  hinweise:
    - "Inhalt: Versiegelungsmaske_2024_Essen.tif, uint8, 0,5 m, Fehlwert 3. Werte 0 und 1. Methodik (BodenversiegelungNRW_meta.zip): Klassen „Versiegelt“ und „nicht Versiegelt“, ohne Angabe der Codes."
    - "1 = versiegelt, belegt 2026-10-10: Anteil der Einsen in Essen 36,5 % (Stichprobe jeder 10. Zelle) = Bodenversiegelungsgrad Essen 36,5 % in Bodenversiegelung-Luftbildbasiert-Gemeinde_2024_EPSG25832_Shape.zip (Feld Bodenversi, KN 05113000)."
    - "Lizenz: open.nrw, „Klimaatlas NRW - Boden: Bodenversiegelung Satellitenbasiert und Luftbildbasiert“, Datenlizenz Deutschland – Zero – Version 2.0, https://open.nrw/dataset/3c495e4d-5cd3-45b4-a3d5-93d16731e8fd (2026-10-10). Die Ordnerseite selbst nennt keine Lizenz."
    - "Im Ordner außerdem: satellitenbasiert 2006 bis 2018 für Essen (bodenversiegelung-sat_Essen_05113000_2006-2018_EPSG25832_TIFF.zip), Gemeindeanteile als Shape, NRW-Raster 1,6 GB."
  erklaerung:
    herkunft: >-
      Die Daten stammen vom Landesamt für Natur, Umwelt und Klima NRW (Projekt EBOVE). Ein Computerverfahren hat
      Luftbilder aus den Jahren 2022 bis 2024 ausgewertet und jede kleine Fläche als versiegelt oder nicht
      versiegelt eingestuft. Der Stand heißt 2024; laut Katalog erscheint alle zwei Jahre ein neuer.
    inhalt: >-
      Der Datensatz ist ein feines Raster für Essen: Jede Zelle ist einen halben Meter mal einen halben Meter groß
      und hat nur zwei mögliche Werte, versiegelt oder nicht versiegelt. Versiegelt heißt, der Boden ist mit
      Gebäuden, Asphalt, Beton oder Pflaster bedeckt. Insgesamt sind in Essen 36,5 Prozent der Fläche versiegelt,
      genau wie in der Gemeindetabelle des Landesamts.
    nutzen: >-
      Die App berechnet daraus im Thema „Versiegelter Boden“ den Anteil versiegelter Fläche je Stadtteil. Das ist
      wichtig für Hitze und Regenwasser, weil versiegelter Boden sich aufheizt und kein Wasser aufnimmt.
    lesen: >-
      Es gibt nur zwei Stufen; teilweise versiegelte Flächen wie Rasengittersteine oder Schotter sind nicht eigens
      ausgewiesen. Bäume über Straßen verdecken Versiegelung, begrünte Dächer zählen als versiegelt. Der Anteil
      bezieht sich auf die ganze Fläche des Stadtteils mit Wald und Wasser, nicht auf die Menschen. Mit der älteren
      Satellitenreihe ist der Wert nicht vergleichbar.


      Auch diese Reihe veröffentlicht das Landesamt für Natur, Umwelt und Klima NRW. Sie beruht auf Satellitendaten
      des europäischen Programms Copernicus und liegt für die Jahre 2006, 2009, 2012, 2015 und 2018 vor. Neuere
      Jahre gibt es in dieser Reihe nicht.
    inhalt: >-
      Für jedes der fünf Jahre gibt es ein Raster über Essen. Jede Zelle ist 20 mal 20 Meter groß, im Jahr 2018 10
      mal 10 Meter, und enthält den Versiegelungsgrad in Prozent von 0 bis 100. Für ganz Essen liegt der mittlere
      Wert zwischen gut 28 Prozent (2006) und knapp 31 Prozent (2018).
    nutzen: >-
      Die App zeigt damit im Thema „Versiegelter Boden“ einen Verlauf über die Jahre als Karte. So sehen Sie, in
      welchen Stadtteilen sich zwischen 2006 und 2018 etwas verändert hat; in den meisten war es weniger als ein
      Prozentpunkt.

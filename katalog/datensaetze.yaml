      das Thema „Kühle Orte“, das zeigt, welcher Anteil der Fläche eines Stadtteils höchstens 300 Meter Luftlinie
      von einem kühlen Ort entfernt liegt.
    lesen: >-
      Die App rechnet mit Luftlinie, der echte Fußweg ist oft länger. Jeder Ort zählt gleich, ob kleiner Platz oder
      großer Park, und Öffnungszeiten oder Eintritt werden nicht berücksichtigt. Wälder stehen nicht in der Liste,
      obwohl sie oft selbst kühle Orte sind.


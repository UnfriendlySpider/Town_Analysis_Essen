      Es sind nur die von der Stadt gepflanzten Jungbäume, nicht der ganze Baumbestand: Wald, Parkbäume, ältere
      Straßenbäume und private Bäume fehlen. Gefällte Bäume stehen nicht in den Daten, viele neue Bäume können also

# Datensätze: einzelne Daten, die das Projekt laden, ansehen oder auswerten kann.
#
# Jeder Eintrag verweist über `quelle` auf einen Anbieter in quellen.yaml und über `lizenz`
# auf lizenzen.yaml. `download.art` bestimmt, ob die App einen Knopf zum Laden zeigt:
#   datei        eine Datei unter fester Adresse
#   verzeichnis  eine Datei aus einem Download-Ordner, gefunden über `muster` (index.json oder Linkliste)
#   wfs          Objekte eines WFS für das Stadtgebiet (braucht `typname`)
#   api          eine JSON-Abfrage
#   manuell      von Hand laden, danach mit `uv run essen einlesen <id> <datei>` übernehmen
#   keiner       nichts zu laden, nur ein Kartendienst zum Ansehen
#
# `status`: geprueft (Adresse bestätigt), ungeprueft (eingetragen, noch nicht bestätigt),
#           manuell (kein automatischer Download), dienst (nur Kartendienst).
#
# Aufbau und Felder: docs/katalog.md. Nach Änderungen: uv run essen katalog --pruefen

datensaetze:

# ------------------------------------------------------------------ Grundlagen und Grenzen

- id: stadtteile
  titel: Stadtteilgrenzen Essen
  quelle: essen-opendata
  bereitsteller: Stadt Essen
  themen: [geo]
  beschreibung: Grenzen der 50 Stadtteile als Flächen in WGS84. Bezug für alle Auswertungen je Stadtteil.
  format: GeoJSON
  raumbezug: Stadt Essen, 50 Stadtteile
  stand: laut Portal
  lizenz: dl-de-by-2.0
  seite: https://opendata.essen.de/dataset/verwaltungsgrenzen-der-stadt-essen
  download:
    art: datei
    url: https://opendata.essen.de/sites/default/files/Stadtteile_WGS84.geojson
    datei: Stadtteile_WGS84.geojson
  felder:
    name: STADTTEILE
    nummer: STADTT
    bezirk: STADTBEZ
  status: geprueft
  geprueft: "2026-10-10: geladen, 50 Flächen, 210,27 km²; STADTT mit der Liste des Amts für Statistik (Bevoelkerungszahlen.pdf, Stand 30.06.2026) abgeglichen, 50 von 50 gleich"
  analysen: [hitze-nacht]
  hinweise:
    - "Felder: STADTT ist die amtliche Stadtteilnummer 1 bis 50, STADTBEZ der Stadtbezirk 1 bis 9, STAT_NR = STADTBEZ × 100 + STADTT, LDS ein 13-stelliger Schlüssel. FID (0–49) und OBJECTID (1–50) sind technische Kennungen und nicht die Stadtteilnummer (FID stimmt nur in 1 von 50 Fällen)."
    - "Abgleich der Nummern: https://media.essen.de/media/wwwessende/aemter/12/Bevoelkerungszahlen.pdf (Stadt Essen, Amt für Statistik, Stadtforschung und Wahlen)."
    - "Lizenz bestätigt 2026-10-10 auf der Datensatzseite „Verwaltungsgrenzen der Stadt Essen“ (Feld Lizenz: „Datenlizenz Deutschland Namensnennung 2.0“, angepasst 2024-07-02, Kontakt opendata@essen.de). Dort auch Stadtgrenze und Stadtbezirke als GeoJSON und Shape-ZIP."
  erklaerung:
    herkunft: >-
      Die Stadt Essen veröffentlicht die Grenzen ihrer Stadtteile auf ihrem Open-Data-Portal als Teil der
      Verwaltungsgrenzen. Es sind amtliche Grenzen aus der Verwaltung, keine Messung. Den Stand nennt das Portal
      selbst; die Nummern der Stadtteile wurden im Oktober 2026 mit einer Liste des städtischen Amts für Statistik
      abgeglichen und stimmen in allen 50 Fällen überein.
    inhalt: >-
      Der Datensatz enthält 50 Flächen, eine für jeden Stadtteil, zusammen rund 210 Quadratkilometer. Zu jeder
      Fläche gehören der Name des Stadtteils, seine amtliche Nummer von 1 bis 50 und die Nummer des Stadtbezirks, zu
      dem er gehört. Daneben gibt es technische Kennungen, die nichts mit der Stadtteilnummer zu tun haben.
    nutzen: >-
      Die Stadtteile sind der gemeinsame Bezug fast aller Auswertungen dieser App. Jede Kennzahl je Stadtteil, etwa
      bei Hitze in der Nacht, Grün, Lärm, Starkregen, Versiegelter Boden, Neue Bäume oder Haushalte, wird auf diese
      Flächen verteilt. Auf der Karte können Sie die Grenzen mit Namen einblenden.
    lesen: >-
      Die Grenzen sind Verwaltungsgrenzen und sagen nichts darüber aus, wie ein Viertel im Alltag wahrgenommen wird.
      Die Stadtteile sind sehr unterschiedlich groß, und alle Anteile in der App beziehen sich auf die ganze Fläche
      eines Stadtteils, auch auf Wald und Wasser. Ein Flächenanteil ist deshalb nie dasselbe wie ein Anteil der dort
      lebenden Menschen. Bei einer Weitergabe muss die Stadt Essen als Quelle genannt werden.

- id: stadtbezirke
  titel: Stadtbezirksgrenzen Essen
  quelle: essen-opendata
  bereitsteller: Stadt Essen
  themen: [geo]
  beschreibung: Grenzen der neun Stadtbezirke. Teil der Verwaltungsgrenzen auf dem Open-Data-Portal.
  format: GeoJSON (WGS84)
  raumbezug: Stadt Essen, 9 Stadtbezirke
  stand: laut Portal
  lizenz: dl-de-by-2.0
  seite: https://opendata.essen.de/dataset/verwaltungsgrenzen-der-stadt-essen
  download:
    art: datei
    url: https://opendata.essen.de/sites/default/files/Stadtbezirke_WGS84.geojson
    groesse_mb: 3.7
  status: geprueft
  geprueft: "2026-10-10: geladen (Stadtbezirke_WGS84.geojson, 3.7 MB) und inspiziert: 9 Flächen in EPSG:4326"
  hinweise:
    - "2026-10-10: Ressource des Datensatzes „Verwaltungsgrenzen der Stadt Essen“, HTTP 200, application/geo+json, 3.734.135 B. Lizenz laut DKAN (package_show, 2026-10-10): https://www.govdata.de/dl-de/by-2-0."
  erklaerung:
    herkunft: >-
      Die Grenzen der Stadtbezirke stammen ebenfalls von der Stadt Essen und gehören zu den Verwaltungsgrenzen auf
      ihrem Open-Data-Portal. Es sind amtliche Grenzen aus der Verwaltung. Den Stand gibt das Portal an; im Katalog
      dieser App ist kein eigenes Datum vermerkt.
    inhalt: >-
      Der Datensatz enthält neun Flächen, eine für jeden Stadtbezirk. Jeder Bezirk fasst mehrere Stadtteile
      zusammen. Welche weiteren Eigenschaften zu den Flächen gehören, ist im Katalog nicht beschrieben.
    nutzen: >-
      Mit den Bezirken lassen sich Ergebnisse gröber zusammenfassen oder ein Stadtteil mit seinem Bezirk
      vergleichen. Die Werte je Bezirk auf den Seiten „Mein Stadtteil“ und „Themen“ rechnet die App aus den
      Stadtteilen und deren Bezirksnummer; diese Grenzen braucht sie dafür nicht.
    lesen: >-
      Wie bei den Stadtteilen handelt es sich um Verwaltungsgrenzen. Ein Bezirk ist eine große, gemischte Fläche, in
      der sich sehr unterschiedliche Stadtteile verbergen können. Bei einer Weitergabe muss die Stadt Essen als
      Quelle genannt werden.

- id: hauskoordinaten
  titel: Amtliche Hauskoordinaten Essen
  quelle: essen-geo
  bereitsteller: Stadt Essen, Amt für Geoinformation, Vermessung und Kataster
  themen: [geo]
  beschreibung: Adresspunkte aller Gebäude. Gut, um Adressen Stadtteilen zuzuordnen.
  format: WFS (GML, EPSG:25832 auf Anfrage), GeoJSON (WGS84, Stand 01.04.2024)
  raumbezug: Stadt Essen, Adresspunkte
  stand: laut Portal
  lizenz: dl-de-by-2.0
  seite: https://opendata.essen.de/dataset/amtliche-hauskoordinaten-essen
  download:
    art: wfs
    url: https://geo.essen.de/arcgis/services/essen/Amtliche_Hauskoordinaten/MapServer/WFSServer
    typname: Amtliche_Hauskoordinaten:Hauskoordinaten
  status: geprueft
  geprueft: "2026-10-10: geladen (hauskoordinaten.gml, 93.1 MB) und inspiziert: GML, 103.127 Punkte in der Box um Essen (enthält Randbereiche der Nachbarstädte)"
  hinweise:
    - "2026-10-10: WFS-Ressource des Datensatzes; GetCapabilities nennt Amtliche_Hauskoordinaten:Hauskoordinaten. Ausgabe nur GML (format weglassen). Laut Recherche-Agent rund 93.400 Objekte im Stadtgebiet, mit EPSG:25832 abgefragt ohne Probleme mit dem Koordinatensystem. Lizenz laut DKAN (package_show, 2026-10-10): https://www.govdata.de/dl-de/by-2-0."
    - "Das GeoJSON (Hauskoordinaten_010424.geojson, 59 MB) ist Stand 01.04.2024; der WFS ist aktueller."
  erklaerung:
    herkunft: >-
      Die amtlichen Hauskoordinaten veröffentlicht das Amt für Geoinformation, Vermessung und Kataster der Stadt
      Essen. Sie stammen aus dem amtlichen Vermessungswesen, also aus der Verwaltung. Die App holt sie über einen
      Kartendienst, der aktueller ist als die ebenfalls angebotene Datei mit dem Stand 1. April 2024.
    inhalt: >-
      Der Datensatz besteht aus Punkten, je einer für eine Gebäudeadresse. Beim Laden kamen rund 103.000 Punkte
      zusammen, weil das abgefragte Rechteck auch Randbereiche der Nachbarstädte enthält. Welche Angaben genau zu
      jedem Punkt gehören, ist im Katalog nicht beschrieben.
    nutzen: >-
      Mit den Hauskoordinaten lassen sich Adressen einem Stadtteil zuordnen oder Gebäude zählen. Die App lädt den
      Datensatz, nutzt ihn aber derzeit in keinem Thema.
    lesen: >-
      Ein Punkt steht für eine Adresse, nicht für eine Wohnung oder eine bestimmte Zahl von Menschen. Für
      Auswertungen über Essen müssen die Punkte aus den Nachbarstädten erst herausgefiltert werden. Bei einer
      Weitergabe muss die Stadt Essen als Quelle genannt werden.

- id: basemap-de
  titel: basemap.de Web Raster grau
  quelle: bkg
  bereitsteller: GeoBasis-DE / BKG
  themen: [geo]
  beschreibung: Amtliche Hintergrundkarte für Deutschland in Grau. Wird in der App und in exportierten Karten direkt vom BKG geladen.
  format: Kartenkacheln (WMTS)
  raumbezug: Deutschland
  stand: laufend
  lizenz: cc-by-4.0
  namensnennung: "© GeoBasis-DE / BKG ({jahr}) CC BY 4.0"
  seite: https://basemap.de/
  download:
    art: keiner
  dienste:
    - art: xyz
      titel: basemap.de grau
      url: https://sgx.geodatenzentrum.de/wmts_basemapde/tile/1.0.0/de_basemapde_web_raster_grau/default/GLOBAL_WEBMERCATOR/{z}/{y}/{x}.png
  status: dienst
  hinweise:
    - "2026-10-10: Kacheln „grau“ antworten (HTTP 200, image/png). Lizenz CC BY 4.0 mit Quellenvermerk „© GeoBasis-DE / BKG (Jahr des letzten Datenbezugs) CC BY 4.0“ (WMTS-Capabilities, Nutzungsbedingungen-PDF)."
  erklaerung:
    herkunft: >-
      Die graue Hintergrundkarte kommt vom Bundesamt für Kartographie und Geodäsie und beruht auf den amtlichen
      Geodaten der Länder. Sie wird laufend gepflegt. Die App lädt sie nicht herunter, sondern ruft die Kartenbilder
      beim Anzeigen direkt beim Bundesamt ab.
    inhalt: >-
      Der Dienst liefert fertige Kartenbilder für ganz Deutschland in Grautönen. Es sind Bilder zum Ansehen, keine
      Daten mit Zahlen oder Eigenschaften.
    nutzen: >-
      Die Karte liegt unter allen Karten der App und unter den exportierten Kartenseiten, damit Sie sich in der
      Stadt zurechtfinden. Die grauen Töne lassen die farbigen Kennzahlen gut hervortreten.
    lesen: >-
      Die Hintergrundkarte dient nur der Orientierung und fließt in keine Rechnung ein. Ohne Internetverbindung
      bleibt der Hintergrund leer, die Kennzahlen funktionieren trotzdem. Bei einer Weitergabe ist der Vermerk des
      Bundesamts mit dem Jahr des Abrufs zu nennen.

- id: gebaeude-3d-nrw
  titel: 3D-Gebäudemodelle NRW (LoD1, LoD2)
  quelle: geobasis
  bereitsteller: Bezirksregierung Köln, Geobasis NRW
  themen: [geo, energie]
  beschreibung: Gebäude mit Höhe und Dachform. Grundlage für Gebäudebestand, Bauhöhen und Solarpotenzial.
  format: OGC API Features, CityGML, 3D Tiles
  raumbezug: NRW, Einzelgebäude
  stand: Laserscan 2019 bis 2024
  lizenz: dl-de-zero-2.0
  seite: https://www.bezreg-koeln.nrw.de/geobasis-nrw/produkte-und-dienste/3d-gebaeudemodelle
  download:
    art: manuell
    hinweis: Über die OGC API Features (https://ogc-api.nrw.de/3dg/v1) für das Stadtgebiet abfragen. Ein automatischer Abruf ist noch nicht eingebaut.
  status: manuell
  hinweise:
    - "2026-10-10: Download-Ordner mit index.json je LoD (z. B. https://www.opengeodata.nrw.de/produkte/geobasis/3dg/lod2_gml/lod2_gml/), 1-km-Kacheln LoD2_32_<E>_<N>_1_NW.gml; um Essen rund 700 Kacheln, LoD1 etwa 5 GB, LoD2 etwa 13 GB. Die Ladeart verzeichnis nimmt nur eine Datei, deshalb weiter manuell."
    - "OGC API https://ogc-api.nrw.de/3dg/v1/collections/building/items liefert CityJSON (kein GeoJSON); bbox mit kodierten Kommas (%2C). Lizenzlink der Collection: DL-DE Zero 2.0."
  erklaerung:
    herkunft: >-
      Die 3D-Gebäudemodelle erstellt Geobasis NRW bei der Bezirksregierung Köln für ganz Nordrhein-Westfalen.
      Grundlage sind Laserscan-Befliegungen aus den Jahren 2019 bis 2024. Wie oft die Modelle erneuert werden, ist
      nicht angegeben.
    inhalt: >-
      Der Datensatz beschreibt einzelne Gebäude mit ihrer Höhe, in der genaueren von zwei Detailstufen auch mit der
      Dachform. Die Daten sind in Kacheln von einem Kilometer Seitenlänge aufgeteilt; für Essen sind das rund 700
      Kacheln und je nach Detailstufe etwa 5 bis 13 Gigabyte.
    nutzen: >-
      Mit den Gebäudemodellen kann man den Gebäudebestand, Bauhöhen oder das Potenzial für Solaranlagen untersuchen.
      Die App nutzt den Datensatz derzeit in keinem Thema.
    lesen: >-
      Die App lädt diese Daten nicht automatisch, weil sie sehr groß und auf viele Dateien verteilt sind; Sie
      müssten sie von Hand holen. Die Gebäude zeigen den Stand der jeweiligen Befliegung, neuere Bauten können
      fehlen. Die Daten dürfen ohne Bedingungen genutzt werden.

- id: landbedeckung-nrw
  titel: Landbedeckung NRW
  quelle: geobasis
  bereitsteller: Land NRW, Geobasis NRW
  themen: [gruen, klima, geo]
  beschreibung: "15 Klassen der Bodenbedeckung, unter anderem Laub- und Nadelbäume, Gras, Hochbau, Tiefbau und Wasser."
  format: GeoPackage
  raumbezug: NRW, Lagegenauigkeit 1 bis 2 m
  stand: jährlich, Stand 01.01.2024
  lizenz: dl-de-by-2.0
  namensnennung: "Enthält modifizierte Copernicus Sentinel-2 Daten [2023], verarbeitet durch Geobasis NRW; dl-de/by-2-0 (www.govdata.de/dl-de/by-2-0); https://www.wms.nrw.de/geobasis/wms_nw_landbedeckung"
  seite: https://www.opengeodata.nrw.de/produkte/geobasis/lusat/akt/lb_nrw/
  download:
    art: verzeichnis
    ordner: https://www.opengeodata.nrw.de/produkte/geobasis/lusat/akt/lb_nrw/
    muster: "lb_nrw_05100000_*_EPSG25832_GeoPackage.zip"   # Regierungsbezirk Düsseldorf, darin Essen
    groesse_mb: 849.5
  dienste:
    - art: wms
      titel: WMS Landbedeckung NRW
      url: https://www.wms.nrw.de/geobasis/wms_nw_landbedeckung
  status: geprueft
  geprueft: "2026-10-10: geladen (lb_nrw_05100000_Düsseldorf_EPSG25832_GeoPackage.zip, 849,5 MB; entpackt 7,4 GB) und inspiziert; Codes mit den Stildateien belegt (katalog/zuordnungen/landbedeckung-nrw.yaml)"
  analysen: [gruenanteil]
  hinweise:
    - "Laut index.json (2026-10-10) je Regierungsbezirk ein GeoPackage (Arnsberg 1,08 GB, Detmold 734 MB, Düsseldorf 850 MB, Köln 999 MB, Münster 793 MB) und lb_nrw_metadata.zip (Kachel-Aufnahmedaten). Essen liegt im Regierungsbezirk Düsseldorf. Laden über 500 MB nur nach Rückfrage."
    - "Lizenz bestätigt 2026-10-10 in den WMS-Capabilities (Fees): „Die Daten der Landbedeckung können unter der Datenlizenz Deutschland – Namensnennung – Version 2.0 genutzt werden.“ open.nrw nennt nur „Es gelten keine Zugriffsbeschränkungen“."
    - "Pflichtvermerk laut WMS: „Enthält modifizierte Copernicus Sentinel-2 Daten [2023], verarbeitet durch Geobasis NRW; dl-de/by-2-0 (www.govdata.de/dl-de/by-2-0); https://www.wms.nrw.de/geobasis/wms_nw_landbedeckung.“"
    - "Legende des WMS (nw_landbedeckung): Hochbau, Tiefbau, Festgestein, Lockermaterial, Krautige Vegetation (Gras; Röhricht, Schilf; Getreide, Staudengewächse, Farne), Holzige Vegetation (Bäume Laub; Bäume Nadel; Gehölz; Büsche, Sträucher), Meer, Binnengewässer (fließend; stehend), Eis. Festgestein, Meer und Eis kommen in NRW nicht vor."
    - "Inhalt: Duesseldorf.gpkg mit 6 Layern (lb_hochbau, lb_tiefbau, lb_krautigevegetation, lb_holzigevegetation, lb_lockermaterial, lb_binnengewaesser) und QGIS-Stildateien je Layer. In Essen decken die Layer 21.024 von 21.027 ha ab."
  erklaerung:
    herkunft: >-
      Die Landbedeckung NRW stellt Geobasis NRW bereit. Sie entsteht aus Satellitenbildern des europäischen
      Programms Copernicus (Sentinel-2, Aufnahmen aus 2023), ergänzt um Luftbilder, Höhenmodelle und amtliche
      Geodaten. Sie wird jährlich erneuert; der verwendete Stand ist der 1. Januar 2024, die Bilder stammen je nach
      Gebiet aus 2022 oder 2023.
    inhalt: >-
      Der Datensatz teilt die Landschaft lückenlos in Flächen ein, jede mit genau einer Art der Bodenbedeckung.
      Unterschieden werden unter anderem Laub- und Nadelbäume, Gehölze und Büsche, Gras, Getreide und Stauden,
      Hochbau, Tiefbau, offener Boden und Wasser. In Essen decken die Flächen fast das ganze Stadtgebiet ab.
    nutzen: >-
      Die App berechnet daraus im Thema „Grün“, welcher Anteil der Fläche eines Stadtteils mit Pflanzen bewachsen
      ist und welcher mit Bäumen. Im Thema „Starkregen“ zieht die App mit ihren Gewässerflächen Bäche, Teiche, Ruhr und Baldeneysee ab, damit
      nur Wasser an Land zählt. Man kann damit auch sehen, wie viel Fläche bebaut oder mit Wasser bedeckt ist.
    lesen: >-
      Bewachsen ist nicht dasselbe wie öffentliches Grün: Äcker, private Gärten, Friedhöfe und Bahnböschungen zählen
      mit. Die Satellitenbilder haben eine Auflösung von 10 Metern, deshalb sind einzelne Straßenbäume, Vorgärten
      und schmale Grünstreifen nur teilweise erfasst. Ein grüner Anteil beschreibt Fläche, nicht wie viele Menschen
      in der Nähe von Grün wohnen. Bei einer Weitergabe ist ein Pflichtvermerk zu Geobasis NRW und den
      Copernicus-Daten zu nennen.

# ------------------------------------------------------------------ Klima und Hitze

- id: klimaanalyse-nacht-raster
  titel: Klimaanalyse NRW 2026 – Klimaanalysekarte Nacht (Raster)
  quelle: lanuk
  bereitsteller: Landesamt für Natur, Umwelt und Klima NRW (LANUK)
  themen: [klima]
  beschreibung: >-
    Nachtsituation um 4 Uhr MEZ in einer sommerlichen Strahlungsnacht, berechnet mit dem Modell FITNAH-3D.
    Für bebaute Flächen gibt es acht Klassen der Lufttemperatur, für Grün- und Freiflächen die Kaltluft.
  format: GeoTIFF im ZIP
  raumbezug: NRW, 25-m-Raster, EPSG:25832
  stand: 2026, Datei vom 09.04.2026
  lizenz: dl-de-zero-2.0
  seite: https://www.opengeodata.nrw.de/produkte/umwelt_klima/klima/klimaanalyse/analyse-nacht/
  download:
    art: verzeichnis
    ordner: https://www.opengeodata.nrw.de/produkte/umwelt_klima/klima/klimaanalyse/analyse-nacht/
    muster: "*Karte-Nacht*TIFF*.zip"
    groesse_mb: 363.5
  dienste:
    - art: wms
      titel: WMS Klimaanpassung Klimaanalyse
      url: https://www.wms.nrw.de/umwelt/klimaanpassung_klimaanalyse
  status: geprueft
  geprueft: "2026-10-10: geladen (Dateiname und Größe im index.json des Ordners); Inhalt inspiziert, Kodierung mit Methodik-PDF und WMS-Legende abgeglichen (katalog/zuordnungen/klimaanalyse-nacht-raster.yaml)"
  analysen: [hitze-nacht]
  begleitend: [klimaanalyse-beschreibung]
  hinweise:
    - "Das ZIP (14 TIFF, 383 MB entpackt) enthält kein Klassenraster, sondern stetige Werte (float32, Fehlwert -999): PL_KY_NACHT_LT_TYP/EXT = Lufttemperatur um 4 Uhr in °C nur im Wirkraum, PL_KY_NACHT_KVSD_TYP/EXT = Kaltluftvolumenstromdichte in m³/(s·m) nur im Ausgleichsraum, PL_KY_NACHT_Stroemungsrichtung_* = Strömung (2 Bänder) im Gitter 100 bis 2000 m. TYP = typischer, EXT = extremer Sommertag."
    - Die acht Klassen entstehen aus der Temperatur nach Tabelle 1 der Methodik Karte Nacht; Zuordnung in katalog/zuordnungen/klimaanalyse-nacht-raster.yaml.
  erklaerung:
    herkunft: >-
      Die Daten kommen vom Landesamt für Natur, Umwelt und Klima NRW (LANUK) und gehören zur Klimaanalyse NRW 2026.
      Sie sind nicht gemessen, sondern mit einem Computermodell (FITNAH-3D) für eine Sommernacht berechnet, die
      Fachleute „sommerliche Strahlungsnacht“ nennen. Die Datei stammt vom April 2026. Die Lizenz erlaubt jede
      Nutzung ohne Bedingungen.
    inhalt: >-
      Der Datensatz ist ein Raster aus Quadraten von 25 mal 25 Metern für ganz Nordrhein-Westfalen. Für bebaute
      Flächen steht darin die Lufttemperatur um 4 Uhr nachts in Grad Celsius, für Grün- und Freiflächen stattdessen,
      wie viel kühle Luft dort fließt. Es gibt je eine Fassung für einen typischen und für einen extremen Sommertag.
      Aus der Temperatur bildet die App acht Stufen von „sehr niedrig“ bis „extreme nächtliche Überwärmung“.
    nutzen: >-
      Mit dem Raster sehen Sie, welche Wohn- und Gewerbegebiete sich nachts kaum abkühlen. Die App nutzt es für das
      Thema „Hitze in der Nacht“ und als einen der drei Bausteine der „Mehrfachbelastung“. Dort zeigt sie, welcher
      Anteil der bebauten Fläche eines Stadtteils um 4 Uhr wärmer als 20 °C ist.
    lesen: >-
      Es sind Modellwerte für eine einzelne Sommernacht, keine Messungen und keine Zählung, wie oft solche Nächte
      vorkommen. Die App rechnet standardmäßig mit dem extremen Sommertag, weil im typischen Szenario in Essen

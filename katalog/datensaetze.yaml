      die Haushalte aus den Meldedaten, zum Beispiel aus Familienbeziehungen und gleicher Adresse; sie werden also
      nicht gezählt oder erfragt. Die Werte gelten jeweils zum 31. Dezember und liegen jährlich von 2007 bis 2025
      vor.
    inhalt: >-
      Für jeden der 50 Stadtteile und jedes Jahr steht dort, wie viele Privathaushalte es gibt, wie viele davon aus
      einer Person bestehen, in wie vielen Kinder leben und wie viele Menschen insgesamt in Privathaushalten leben.
      Einige weitere Spalten sind in der Quelle nicht beschrieben.

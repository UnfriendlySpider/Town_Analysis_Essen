  format: CSV je Merkmal
  raumbezug: Gitterzellen (100 m, 1 km, 10 km)
  stand: Zensus 2022
  lizenz: dl-de-by-2.0
  seite: https://www.destatis.de/DE/Themen/Gesellschaft-Umwelt/Bevoelkerung/Zensus2022/_inhalt.html
  download:

  geprueft: "2026-10-11: geladen (bodenversiegelung-sat_Essen_05113000_2006-2018_EPSG25832_TIFF.zip, 10,0 MB) und inspiziert; Mittel für Essen mit den Gemeindewerten des Anbieters abgeglichen"
  analysen: [versiegelung]
  hinweise:
    - "Inhalt (2026-10-11): fünf GeoTIFF, je Jahr anders aufgebaut. VG_20m_2006 (uint8, EPSG:3035, kein Fehlwert), VG_20m_2009 und VG_20m_2012 (float32, EPSG:3035), VG_20m_2015 (uint8, EPSG:25832), VG_10m_2018 (int8, EPSG:3035, Fehlwert −128). Trotz „EPSG25832“ im ZIP-Namen sind vier Raster in EPSG:3035."
    - "Werte: Versiegelungsgrad in Prozent, 0 bis 100. Beleg: Methodik_Umwelt_Bodenversiegelung_satellitenbasiert.pdf (Bodenversiegelung-satellitenbasiert_meta.zip): „Dabei reichen die Werte von 0 bis 100 % Versiegelung“, Quelle Copernicus HRL Imperviousness (20 m; 2018 10 m). Im Raster 2012 kommt außerdem 254 vor (24 Zellen im Stadtgebiet); das ist kein Prozentwert und wird nicht gezählt."
    - "Abgleich 2026-10-11, Mittel der Zellen mit Mittelpunkt im Stadtgebiet gegen das Feld MEAN der Gemeindetabellen (Bodenversiegelung-Satellitenbasiert-Gemeinde_<Jahr>_EPSG25832_Shape.zip, GN Essen): 2006 28,559 / 28,560; 2009 28,763 / 28,757; 2012 28,830 / 28,834; 2015 28,859 / 28,860; 2018 30,803 / 30,797."
    - "Laut Methodik sorgt der Wechsel von 20 auf 10 m Auflösung 2018 für einen deutlichen Anstieg der Flächen mit hohem Versiegelungsgrad; 2015 und 2018 sind deshalb nur bedingt vergleichbar. Mit den Luftbilddaten 2024 (bodenversiegelung-nrw, versiegelt ja/nein, 36,5 %) gar nicht vergleichbar."
    - "2026-10-11: Datei im index.json des Ordners: bodenversiegelung-sat_Essen_05113000_2006-2018_EPSG25832_TIFF.zip (9.992.539 B, 2025-06-12). Lizenz wie bodenversiegelung-nrw (open.nrw, „Bodenversiegelung Satellitenbasiert und Luftbildbasiert“, DL-DE Zero 2.0)."
    - "Im selben Ordner: Bodenversiegelung-Satellitenbasiert-Gemeinde_<Jahr>_EPSG25832_Shape.zip für 2006, 2009, 2012, 2015, 2018 (Anteile je Gemeinde, zum Abgleich) und Bodenversiegelung-satellitenbasiert_meta.zip (Beschreibung)."

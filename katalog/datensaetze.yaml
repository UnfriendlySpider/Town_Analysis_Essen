  hinweise:
    - "2026-10-10: Ressource Umweltzone_Essen_0.geojson (317.371 B). Lizenz laut DKAN (package_show, 2026-10-10): https://www.govdata.de/dl-de/by-2-0."
  erklaerung:
    herkunft: >-
      Die Stadt Essen veröffentlicht die Grenze der Umweltzone in ihrem Open-Data-Portal. Es handelt sich um eine
      Festlegung der Verwaltung, nicht um eine Messung. Als Stand ist 2024 angegeben.
    inhalt: >-
      Die Datei enthält drei Flächen: eine große Fläche mit mehreren Aussparungen und zwei kleinere Flächen im
      Norden. Weitere Angaben, etwa welche Regeln in der Zone gelten, stehen nicht in der Datei.
    nutzen: >-
      Mit dem Datensatz sehen Sie, welche Teile der Stadt in der Umweltzone liegen. Diese App nutzt ihn im Thema
      „Umweltzone“ und berechnet, welcher Anteil der Fläche jedes Stadtteils in der Zone liegt; stadtweit sind es
      gut drei Viertel der Fläche.
    lesen: >-
      Die Umweltzone ist eine Verkehrsregel und sagt nichts darüber, wie gut oder schlecht die Luft tatsächlich ist.
      Ob und wie die Zone heute gilt, weiß der Anbieter; der Datensatz nennt den Stand 2024. Die Aussparungen, meist
      Autobahnen, sind in der Datei nicht beschrieben; die App liest sie als Flächen außerhalb der Zone.


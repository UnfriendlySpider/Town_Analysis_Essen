      Der Datensatz enthält Punkte, je einen für einen Baum. Die App nutzt die Jungbäume, die die Stadt seit 2008
      gepflanzt hat, rund 13.300 Stück; zu jedem gehören unter anderem das Pflanzjahr und eine Angabe zur
      Bewässerung. Eine zweite Ebene mit weiteren Baumstandorten gibt es, die App lädt sie aber nicht.

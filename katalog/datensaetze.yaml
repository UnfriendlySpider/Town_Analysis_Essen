      Der Anstieg 2018 kommt laut Landesamt vor allem von der feineren Auflösung, nicht von neuer Bebauung; 2015 und
      2018 sind deshalb nur bedingt vergleichbar. Mit dem Wert aus den Luftbildern 2024 ist diese Reihe gar nicht

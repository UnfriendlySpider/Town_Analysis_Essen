  themen: [luft]
  beschreibung: NO₂, PM10, O₃, SO₂ und Meteorologie aller Messstationen in NRW, stündlich, vorläufige Werte.
  format: CSV
  raumbezug: NRW, Messstationen
  stand: stündlich vorgesehen
  lizenz: dl-de-zero-2.0
  seite: https://www.opengeodata.nrw.de/produkte/umwelt_klima/luftqualitaet/luqs/aktuelle_luftqualitaet/
  download:
    art: datei
    url: https://www.opengeodata.nrw.de/produkte/umwelt_klima/luftqualitaet/luqs/aktuelle_luftqualitaet/OpenKontiLUQS_aktuelle-messwerte-24h.csv
  status: geprueft
  geprueft: "2026-10: Datei vorhanden, aber seit dem 21.08.2026 nicht aktualisiert"
  hinweise:
    - Die Werte sind vorläufig und nicht validiert.
    - Bei der Prüfung im Oktober 2026 war die Datei seit dem 21.08.2026 nicht aktualisiert. Für Zeitreihen die UBA-Luftdaten nehmen.
  erklaerung:
    herkunft: >-
      Die Daten stammen vom Landesamt für Natur, Umwelt und Klima NRW (LANUK), das ein Netz von Luftmessstationen in
      ganz Nordrhein-Westfalen betreibt. Die Werte werden an den Stationen gemessen und sollen stündlich erneuert
      werden. Bei der Prüfung im Oktober 2026 war die Datei allerdings seit dem 21. August 2026 nicht mehr
      aktualisiert worden.
    inhalt: >-
      Die Datei enthält die Messwerte der letzten 24 Stunden von allen Messstationen in NRW, Stunde für Stunde.
      Gemessen werden Stickstoffdioxid, Feinstaub (PM10), Ozon und Schwefeldioxid, dazu Wetterwerte. Es sind Werte
      je Station, keine Werte für Flächen oder Stadtteile.
    nutzen: >-
      Mit dem Datensatz können Sie nachsehen, wie die Luft an einer Messstation in den letzten Stunden war. Diese
      App nutzt ihn bisher in keinem Thema; für die Entwicklung über die Jahre greift das Thema „Luftqualität“ auf
      die geprüften Jahreswerte des Umweltbundesamts zurück.
    lesen: >-
      Die Werte sind vorläufig und nicht geprüft, sie können sich später noch ändern. Eine Station misst nur an
      ihrem Ort, oft an einer belebten Straße, und steht nicht für einen ganzen Stadtteil. Weil die Datei zuletzt
      nicht mehr erneuert wurde, sollten Sie auf das Datum der Werte achten.


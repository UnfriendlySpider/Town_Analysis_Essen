      Im Thema „Neue Bäume“ zählt die App, wie viele Jungbäume je Quadratkilometer in einem Stadtteil stehen, und
      zeigt über das Pflanzjahr einen Verlauf über die Jahre. Auf der Karte können Sie die Bäume als Punkte

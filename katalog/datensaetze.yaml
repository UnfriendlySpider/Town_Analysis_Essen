    groesse_mb: 24.9
  status: geprueft
  geprueft: "2026-10-10: geladen (bodenversiegelung-lb_Essen_05113000_2024_EPSG25832_TIFF.zip, 24,9 MB) und inspiziert; Werte mit der Gemeindetabelle des Anbieters abgeglichen"

  hinweise:
    - "2026-10-10: Adresse bestätigt (HTTP 200, application/zip, 33.284.924 B, Last-Modified 02.09.2022), noch nicht geladen. Lizenz laut Datensatz (DKAN package_show starkregenkarte): https://www.govdata.de/dl-de/by-2-0."
    - "Inhalt laut Beschreibung: drei Klassen der Einstautiefe für ein 100-jährliches Ereignis, ohne Kanalisation. Koordinatensystem EPSG:4647."
  erklaerung:
    herkunft: >-
      Die Starkregengefahrenkarte stammt von der Stadt Essen und steht in ihrem Open-Data-Portal. Sie ist eine
      Modellrechnung, keine Beobachtung. Die Datei wurde im September 2022 erstellt.
    inhalt: >-
      Die Karte zeigt, wie hoch das Wasser direkt nach einem Starkregen steht, wie er statistisch etwa einmal in 100
      Jahren vorkommt, berechnet ohne die Wirkung der Kanalisation. Die Flächen sind in drei Klassen eingeteilt:
      unter 5 Zentimeter, 5 bis unter 25 Zentimeter sowie 25 Zentimeter und mehr. Die Karte deckt den größten Teil,
      aber nicht die ganze Stadtfläche ab.
    nutzen: >-
      Mit der Karte sehen Sie, wo sich bei sehr starkem Regen Wasser sammeln könnte. Diese App nutzt sie im Thema
      „Starkregen“ und berechnet, welcher Anteil der Fläche jedes Stadtteils 25 Zentimeter oder tiefer unter Wasser
      stünde. Das Ergebnis fließt auch in die „Mehrfachbelastung“ ein.
    lesen: >-
      Weil die Kanalisation fehlt, zeigt die Karte eher zu viel Wasser für häufige, kleinere Regen; für das seltene
      Extremereignis ist das gewollt. Hochwasser von Flüssen wie der Ruhr ist nicht enthalten. In der Karte zählen Bäche, Ruhr und Baldeneysee als
      tiefe Wasserflächen mit; die App zieht sie mit der Landbedeckung NRW ab und bezieht den Anteil auf die
      Landfläche. Bauliche
      Änderungen seit 2022 sind nicht berücksichtigt, und Fläche ist nicht gleich Zahl der betroffenen Menschen.


    - "2026-10-10: Ressource des Datensatzes (51.176 B, geändert 2026-03-13). Die Endung _3 deutet darauf hin, dass sich die Adresse bei jeder Aktualisierung ändert; bei 404 auf der Datensatzseite nachsehen. Lizenz laut DKAN (package_show, 2026-10-10): https://www.govdata.de/dl-de/by-2-0."

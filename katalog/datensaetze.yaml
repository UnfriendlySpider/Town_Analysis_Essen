    groesse_mb: 18
  status: geprueft
  geprueft: "2026-10-10: geladen (Zensus2022_Bevoelkerungszahl.zip, 18.5 MB) und inspiziert: CSV mit Semikolon je Gitter (100 m, 1 km, 10 km), ganz Deutschland"
  hinweise:
    - "Adresse bestätigt 2026-10-10 (HTTP 200, application/zip, Link auf der Destatis-Seite „Bevölkerungszahlen in Gitterzellen (zip, 18 MB)“). Der Server nennt keine Größe; noch nicht geladen. Jedes ZIP enthält 10-km-, 1-km- und 100-m-Gitter für ganz Deutschland als CSV und eine Datensatzbeschreibung (XLSX)."
    - "Weitere Merkmale im selben Ordner, u. a. Anteil_ab_65-jaehrige_in_Gitterzellen.zip (laut Seite 21 MB, auch 100-m-Gitter) und Durchschnittsalter_in_Gitterzellen.zip."
    - "Lizenz geklärt 2026-10-11: Die Datensatzbeschreibung im ZIP (Datensatzbeschreibung_Bevoelkerungszahl_Gitterzellen.xlsx) sagt: „…sind lizenziert unter der Datenlizenz Deutschland – Namensnennung – Version 2.0 (dl-de/by-2-0; http://www.govdata.de/dl-de/by-2-0)“. Urheber: © Statistische Ämter des Bundes und der Länder."
    - "2026-10-11: Kontrollsumme Essen: 570.632 Einwohner in 9.749 Zellen mit Mittelpunkt im Stadtgebiet; Zensus 2022 nennt für Essen 571.039 (−0,07 %, Randzellen und Geheimhaltung). Zellen ohne Einwohner fehlen in der Datei; Sonderzeichen kommen in Essen nicht vor."
    - "Die bisher eingetragene Seite ergebnisse.zensus2022.de führt zur Zensusdatenbank, nicht zu den Gitterdaten."
  erklaerung:
    herkunft: >-
      Die Gitterdaten stammen von den Statistischen Ämtern des Bundes und der Länder und beruhen auf dem Zensus
      2022, einer amtlichen Bevölkerungszählung. Sie geben den Stand dieses Zensus wieder. Ob und wann es neuere
      Gitterdaten gibt, ist nicht angegeben.
    inhalt: >-
      Ganz Deutschland ist in gleich große Quadrate eingeteilt, mit Seitenlängen von 100 Metern, 1 Kilometer und 10
      Kilometern. Für jedes Quadrat steht dort die Zahl der Einwohnerinnen und Einwohner; weitere Dateien enthalten
      andere Merkmale, etwa den Anteil der Menschen ab 65 Jahren oder das Durchschnittsalter. Quadrate ohne
      Einwohner fehlen in der Datei.
    nutzen: >-
      Mit dem Gitter lässt sich schätzen, wie viele Menschen in einer belasteten Fläche wohnen, statt nur die Fläche
      zu zählen. Diese App nutzt die 100-Meter-Quadrate als Zusatz in den Themen „Hitze in der Nacht“, „Lärm“,
      „Starkregen“ und „Mehrfachbelastung“ und nennt dort geschätzte Einwohnerzahlen.
    lesen: >-
      Die App verteilt die Einwohner gleichmäßig über jedes Quadrat; die Zahlen sind deshalb Schätzungen und heißen
      auch so. Für Essen ergeben die Quadrate rund 570.600 Menschen, etwas weniger als die amtliche Zahl des Zensus,
      weil Randquadrate und aus Datenschutzgründen veränderte Werte eine Rolle spielen. Die Zahlen zeigen, wo
      Menschen gemeldet wohnen, nicht wo sie sich tagsüber aufhalten.


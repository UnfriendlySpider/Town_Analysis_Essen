    - "Bedeutung der Werte steht in jeder Antwort unter headers, z. B. NO₂: 1 = „Jahresmittelwert in µg/m³“, 2 = „Zahl der Stundenmittelwerte über 200 µg/m³“; PM₁₀: 2 = „Zahl der Tageswerte über 50 µg/m3“. Laut OpenAPI-Spezifikation (annualbalances): data[0] ist die station id, data[x] der Wert zu headers[x]."
    - "2026-10-11: Alle 570 station ids der NO₂-Bilanz 2024 stehen in der Stationsliste (stations/json, index=id). Essener Stationen über das Feld station city. Beispiel 2024: DENW043 Essen-Ost Steeler Straße 22 µg/m³ NO₂."
    - "Komponenten laut components/json: 1 = PM10, 5 = NO2, 9 = PM2,5. Jahresbilanzen beruhen auf geprüften Daten; das Vorjahr ist ab Juni vollständig."
  erklaerung:
    herkunft: >-
      Das Umweltbundesamt fasst die Messungen aller Luftmessstationen in Deutschland zu Jahresbilanzen zusammen.
      Grundlage sind geprüfte Messwerte. Vorhanden sind die Jahre 2010 bis 2025; ein abgeschlossenes Jahr ist ab
      Juni des Folgejahres vollständig.
    inhalt: >-
      Für jede Station und jedes Jahr stehen darin das Jahresmittel von Stickstoffdioxid und von zwei Größen
      Feinstaub (PM10 und PM2,5) in Mikrogramm je Kubikmeter Luft. Dazu kommt, wie oft Grenzwerte überschritten
      wurden, etwa wie viele Tage der Feinstaub über 50 Mikrogramm lag. Eine Stationsliste nennt Namen und Ort jeder
      Station.
    nutzen: >-
      Diese App nutzt die Jahresbilanzen im Thema „Luftqualität“. Sie zeigt dort, wie sich Stickstoffdioxid und
      Feinstaub an den Essener Stationen seit 2010 entwickelt haben, und vergleicht die Werte mit den heutigen und
      künftigen Grenzwerten der EU und mit den Richtwerten der Weltgesundheitsorganisation.
    lesen: >-
      Die Werte gelten für den Ort der Station, meist an einer belebten Straße, und nicht für ganze Stadtteile;
      deshalb zählt Luft bisher nicht zur Mehrfachbelastung. Welche Stationen messen, ändert sich über die Jahre,
      und das beeinflusst zum Beispiel den höchsten Wert eines Jahres. Das laufende Jahr fehlt, weil es noch keine
      geprüften Daten gibt.


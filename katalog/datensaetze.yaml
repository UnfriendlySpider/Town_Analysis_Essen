      titel: WMS Hinweiskarte Starkregengefahren (BKG)
      url: https://sgx.geodatenzentrum.de/wms_starkregen
  status: dienst
  hinweise:
    - In der Quellenangabe das Jahr des letzten Datenbezugs nennen.
    - "2026-10-10: GetCapabilities antwortet (HTTP 200). Ebenen für NRW: nw_tiefe_agw und nw_tiefe_extrem (Überflutungstiefe bei außergewöhnlichem bzw. extremem Ereignis), nw_geschw_agw, nw_geschw_extrem, nw_gewaesser. Fees: Datenlizenz Deutschland Namensnennung 2.0. Stand 2024, keine Fortführung."
    - "Produktseite: „Die Daten werden geldleistungsfrei gemäß der Datenlizenz Deutschland Namensnennung 2.0 zur Verfügung gestellt.“"
  erklaerung:
    herkunft: >-
      Die Hinweiskarte stammt vom Bundesamt für Kartographie und Geodäsie (BKG). Sie ist eine Modellrechnung, die
      simuliert, wie Wasser nach sehr starkem Regen abfließt und sich sammelt. Der Katalog nennt als Stand Oktober
      2021, ein späterer Hinweis Stand 2024 ohne weitere Fortführung; welche Angabe zutrifft, ist nicht geklärt.
    inhalt: >-
      Die Karte zeigt für ein seltenes Ereignis, wie es statistisch etwa einmal in 100 Jahren vorkommt, und für ein
      extremes Ereignis mit 90 Millimetern Regen in einer Stunde, wie tief das Wasser steht und wie schnell es
      fließt. Die Auflösung ist ein Raster mit Feldern von 1 mal 1 Meter. Für NRW gibt es außerdem eine Ebene mit
      den Gewässern.
    nutzen: >-
      Mit der Karte erkennen Sie, wo sich bei Starkregen Wasser sammeln oder schnell fließen könnte. In dieser App
      ist sie nur als Karte zum Ansehen eingebunden; die App lädt die Daten nicht automatisch und rechnet nicht
      damit. Für das Thema „Starkregen“ nutzt sie die Karte der Stadt Essen.
    lesen: >-
      Es handelt sich um berechnete Hinweise, nicht um beobachtete Überflutungen. Wer die Karte weitergibt, muss das
      BKG mit dem Jahr des Datenbezugs als Quelle nennen.


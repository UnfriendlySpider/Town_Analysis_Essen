  hinweise:
    - Messqualität schwankt stark. Nur als Ergänzung zu den amtlichen Stationen nutzen.
    - Lizenz laut Projektseite ODbL. Auf sensor.community und archive.sensor.community am 2026-10-10 keine Lizenzangabe gefunden; vor einer Weitergabe prüfen.
    - "Die Abfrage liefert nur die Messungen der letzten rund fünf Minuten. Der Umkreis von 12 km um 51,45/7,01 reicht über die Stadtgrenze (z. B. Mülheim). Koordinaten mit exact_location 0 sind gerundet. Für Reihen das Archiv (archive.sensor.community) nutzen."
    - "2026-10-11: Die Fußzeile von sensor.community verlinkt als „DB Contents License“ die Open Data Commons Database Contents License 1.0 (https://opendatacommons.org/licenses/dbcl/1-0/). ODbL (Datenbank) und DbCL (Inhalte) zusammen; vor einer Weitergabe beide nennen."
  erklaerung:
    herkunft: >-
      Die Werte stammen von Feinstaub- und Klimasensoren, die Bürgerinnen und Bürger selbst gebaut und aufgestellt
      haben. Das Projekt Sensor.Community sammelt sie und veröffentlicht sie etwa alle fünf Minuten. Es sind keine
      amtlichen Messungen.
    inhalt: >-
      Die Abfrage liefert die Messungen der letzten rund fünf Minuten von privaten Sensoren im Umkreis von 12
      Kilometern um die Essener Mitte, bei der Prüfung rund 100 Sensoren. Je nach Gerät sind das Feinstaubwerte oder
      Werte wie Temperatur und Luftfeuchte, jeweils mit dem Standort des Sensors. Manche Standorte sind absichtlich
      gerundet.
    nutzen: >-
      Die Sensoren zeigen, wie die Luft gerade an vielen Orten aussieht, auch dort, wo keine amtliche Station steht.
      Diese App nutzt den Datensatz bisher in keinem Thema.
    lesen: >-
      Die Messqualität der Geräte schwankt stark; nutzen Sie die Werte nur als Ergänzung zu den amtlichen Stationen.
      Der Umkreis reicht über die Stadtgrenze hinaus, etwa bis Mülheim, und eine Abfrage zeigt nur einen Augenblick.
      Die Lizenz ist nicht abschließend geklärt und muss vor einer Weitergabe geprüft werden.


  format: GeoTIFF im ZIP (Ausschnitt je Kreis oder kreisfreie Stadt)
  raumbezug: Essen, 0,5-m-Raster, EPSG:25832
  stand: 2024 (Luftbilder 2022 bis 2024), alle zwei Jahre
  lizenz: dl-de-zero-2.0
  seite: https://www.opengeodata.nrw.de/produkte/umwelt_klima/klima/boden/bodenversiegelung/

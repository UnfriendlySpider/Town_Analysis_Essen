    herkunft: >-
      Das Umweltbundesamt stellt die Messwerte aller deutschen Luftmessstationen über eine Online-Schnittstelle
      bereit, darunter die Essener Stationen. Die Werte werden an den Stationen gemessen und stündlich ergänzt.
      Werte des laufenden Jahres sind noch ungeprüft; die endgültigen Daten folgen im Juni des Folgejahres.
    inhalt: >-
      Der Datensatz enthält Messwerte ab 2016 je Station, zum Beispiel Stundenmittel für Stickstoffdioxid, dazu
      einen Luftqualitätsindex, Vorhersagen und Jahresbilanzen. In Essen gibt es mehrere Stationen, etwa in
      Vogelheim, Frohnhausen, an der Steeler Straße oder an der Gladbecker Straße. Nicht alle davon messen heute
      noch.
    nutzen: >-
      Mit diesen Daten lassen sich Verläufe der Luftbelastung an einzelnen Stationen über Stunden und Tage ansehen.
      Diese App nutzt die stündlichen Werte bisher in keinem Thema; das Thema „Luftqualität“ rechnet mit den
      Jahresbilanzen desselben Amts.
    lesen: >-
      Jede Station misst nur an ihrem Standort, meist an stark befahrenen Straßen, und sagt wenig über die Luft im
      ganzen Stadtteil. Aktuelle Werte sind vorläufig und können sich bei der Prüfung noch ändern. Welche Stationen
      es gibt, wechselt mit der Zeit.


luecken:
- art: fehlt
  titel: Parkhausbelegung in Echtzeit
  text: Kein offener Feed für Essen gefunden. Köln und Münster veröffentlichen einen.
  weg: Bei der Stadt und den Parkhausbetreibern anfragen.
- art: fehlt
  titel: Offizieller GTFS-Realtime-Feed
  text: Weder VRR noch Ruhrbahn bieten einen offenen GTFS-RT an.
  weg: Live-Abfahrten über den VRR-OpenService abrufen.
- art: kostenpflichtig
  titel: Arbeitsmarkt nach Stadtteilen
  text: Kleinräumige BA-Daten gibt es nur für Kommunen auf Vertragsbasis.
  weg: Aggregierte Werte bei der Essener Stadtstatistik anfragen.
- art: geschützt
  titel: KomMonitor-API
  text: Die REST-Schnittstelle ist zugriffsgeschützt.
  weg: Beim Amt für Geoinformation, Vermessung und Kataster anfragen.
- art: ungeprüft
  titel: OParl-Basis-URL des Essener RIS
  text: Die Seite sperrt automatisierte Abrufe.
  weg: URL über den Menüpunkt „Schnittstelle OParl“ im Browser ablesen.
- art: ungeprüft
  titel: System-ID von metropolradruhr
  text: Für die nextbike-eigene API nicht bestätigt.
  weg: Das NRW-Bündel auf mobilitaetsdaten.nrw nutzen oder die ID in nextbike-live.json suchen.
- art: kein Beleg
  titel: Ruhrbahn-eigene Daten, EBE-Abfuhrkalender, Mietspiegel- und Haushalts-Rohdaten
  text: Keine Primärquelle gefunden. Das heißt nicht, dass es sie nicht gibt.
  weg: Gezielt über „Daten anfragen“ anstoßen.

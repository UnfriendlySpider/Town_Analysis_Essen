# Quellen: Anbieter, Portale und Schnittstellen mit Daten zu Essen.
# Einzelne Datensätze stehen in datensaetze.yaml und verweisen über `quelle` hierher.
# Aufbau und Felder: docs/katalog.md. Nach Änderungen: uv run essen katalog --pruefen

quellen:

- id: essen-opendata
  name: Open-Data-Portal Stadt Essen
  kurz: opendata.essen.de
  ebene: stadt
  themen: [bevoelkerung, wahlen, geo, mobilitaet, klima, luft, wasser, gruen, wirtschaft, verwaltung, kultur]
  beschreibung: Zentrales Portal der Stadt, seit 2019 online und laufend gepflegt. Zwölf Themenkategorien, die größten
    sind Geo, Politik und Wahlen, Infrastruktur und Verkehr.
  zugang: [DKAN-API (CKAN-Stil), Datastore-Abfrage, CSV · GeoJSON · SHP]
  lizenz: gemischt
  lizenz_hinweis: DL-DE-Zero-2.0 (überwiegend); Einzelne Datensätze unter DL-DE-BY-2.0, z. B. Verwaltungsgrenzen
  aktualitaet: periodisch, je Datensatz
  konto: ohne
  konto_hinweis: ohne Konto
  eignung: 3
  endpunkte:
  - titel: Liste aller Datensätze
    url: https://opendata.essen.de/api/3/action/package_list
  - titel: Alle Datensätze mit Ressourcen
    url: https://opendata.essen.de/api/3/action/current_package_list_with_resources
  - titel: Einzelner Datensatz
    url: https://opendata.essen.de/api/3/action/package_show?id=<datensatz-id>
  - titel: Datastore mit Filter auf Stadtteile
    url: https://opendata.essen.de/api/action/datastore/search.json?resource_id=<RessourceID>&limit=100&filters[Stadtteil]=Kray,Werden
  links:
  - titel: Portal
    url: https://opendata.essen.de/
  - titel: API-Anleitung
    url: https://opendata.essen.de/dkan-api
  - titel: FAQ zur Lizenz
    url: https://opendata.essen.de/faq
  beispiele:
  - 'Verwaltungsgrenzen: Stadt, Bezirke, Stadtteile'
  - Privathaushalte nach Stadtteilen ab 2007
  - Niederlassungen im Unternehmensregister nach Stadtteilen ab 2021
  - Radverkehrszählungen, quartalsweise
  - Messbereiche der Geschwindigkeitsüberwachung, wöchentlich
  - Bewohnerparkbereiche, Kitas, Kühlorte, Starkregenkarte, Stolpersteine
  hinweise:
  - Lizenz jeder Ressource im Feld license auslesen und für BY-Daten die Quellenangabe erzeugen.
  - Rate Limits sind nicht dokumentiert. Abrufe zwischenspeichern.
  - Quartalsdateien erscheinen teils verspätet. Vor dem Einbau die neuesten Zeiträume prüfen.
  kontakt: [opendata@essen.de]

- id: essen-geo
  name: Geodienste der Stadt Essen
  kurz: Geoportal · Amt 62
  ebene: stadt
  themen: [geo, gruen, laerm, energie]
  beschreibung: Karten- und Objektdienste des Amts für Geoinformation, Vermessung und Kataster. Die offenen Dienste
    sind als Ressourcen im Open-Data-Portal verlinkt.
  zugang: [WMS, WFS, GeoJSON (WGS84)]
  lizenz: dl-de-zero-2.0
  lizenz_hinweis: meist DL-DE-Zero-2.0; Angabe je Datensatz prüfen
  aktualitaet: tagesaktuell (WFS)
  konto: ohne
  konto_hinweis: ohne Konto
  eignung: 3
  links:
  - titel: Geoportal
    url: https://www.essen.de/dasistessen/geoportal/uebersicht.de.html
  - titel: Geoportal A–Z
    url: https://www.essen.de/dasistessen/geoportal/A_bis_Z.de.html
  - titel: Hauskoordinaten
    url: https://opendata.essen.de/dataset/amtliche-hauskoordinaten-essen
  beispiele:
  - 'Katasterkarte (WFS): Gebäude und Flurstücke aus ALKIS'
  - 'Amtliche Hauskoordinaten: WFS in ETRS89 und GeoJSON in WGS84'
  - Amtliche Basiskarte und Stadtplan (WMS)
  - Gesamtflächennutzungsplan GFNP (WMS)
  hinweise:
  - Die Dienst-URLs stehen in den Ressourcen der jeweiligen Datensätze auf opendata.essen.de.
  - Für Webkarten das GeoJSON in WGS84 nehmen. Das Koordinatensystem des Hauskoordinaten-WFS macht in QGIS und R
    Probleme.
  - Das Geoportal A–Z zeigt viele weitere Fachkarten (Baustellen, Lärm, Solardachkataster, Stadtbäume, Umweltzonen,
    Wärmeplanung). Nicht jede hat einen offenen Dienst.
  kontakt: [geoinformation@amt62.essen.de]

- id: kommonitor
  name: KomMonitor Essen
  kurz: kleinräumiges Monitoring
  ebene: stadt
  themen: [bevoelkerung, gruen]
  beschreibung: Open-Source-Monitoringsystem mit rund 361 offen freigegebenen Indikatoren (Stand 06.2026) zu Demografie,
    Sozialstruktur, Wohnen und Umwelt, auf Stadtteil- und Baublockebene mit Zeitreihen.
  zugang: [Webanwendung, Export, REST-API (geschützt)]
  lizenz: pruefen
  lizenz_hinweis: offen freigegebene Indikatoren; Lizenz je Indikator prüfen
  aktualitaet: periodisch
  konto: auf-anfrage
  konto_hinweis: API nur auf Anfrage
  eignung: 2
  links:
  - titel: KomMonitor bei essen.de
    url: https://www.essen.de/dasistessen/connected_essen_1/connected_essen_kommonitor_1.de.html
  beispiele:
  - Bevölkerungsstruktur und Altersgruppen
  - Sozialindikatoren
  - Wohnen und Wohnumfeld
  - Umweltindikatoren
  hinweise:
  - Inhaltlich die beste Quelle für einen Sozialatlas. Der technische Zugang ist der Engpass.
  - Für einen API-Zugang direkt beim Amt für Geoinformation, Vermessung und Kataster anfragen.


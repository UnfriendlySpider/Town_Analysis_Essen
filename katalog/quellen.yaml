- id: ris
  name: Ratsinformationssystem Essen
  kurz: ris.essen.de · OParl
  ebene: stadt
  themen: [wahlen, verwaltung]
  beschreibung: SD.NET RIM 4 mit OParl-Schnittstelle. Liefert Sitzungen, Gremien, Vorlagen und Beschlüsse als verlinktes

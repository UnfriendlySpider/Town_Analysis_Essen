  konto: ohne
  konto_hinweis: ohne Konto (OParl-Standard)
  eignung: 2
  endpunkte:
  - titel: Typisches Muster bei SD.NET RIM, für Essen ungeprüft
    url: https://ris.essen.de/<pfad>/webservice/oparl/v1/system
  links:
  - titel: RIS Essen
    url: https://ris.essen.de/
  - titel: oparl-cli

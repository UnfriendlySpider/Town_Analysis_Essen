[project]
name = "essen-daten"
version = "0.2.0"
description = "Private Analyse öffentlicher Geo-, Umwelt- und Stadtdaten für Essen: Datenkatalog, Downloads, Analysen und eine lokale App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.0",
    "folium>=0.19",
    "geopandas>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.4",
    "requests>=2.31",
    "shapely>=2.0",
    "streamlit>=1.65",
    "streamlit-folium>=0.25",
]

[project.scripts]
essen = "essen.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/essen"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "data_test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "PERF", "RUF"]
ignore = [
    "E501",    # lange Texte für Menschen bleiben in einer Zeile
    "E702",    # kurze Befehlsfolgen mit Semikolon (argparse-Aufbau in cli.py)
    "PERF401", # Schleifen mit append sind hier meist lesbarer als Comprehensions
    "RUF005",  # liste + [eintrag] ist lesbar genug
    "RUF001",  # deutsche Typografie: „“, –, …
    "RUF002",
    "RUF003",
    "SIM108",  # if/else statt Ternärausdruck ist oft lesbarer
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
